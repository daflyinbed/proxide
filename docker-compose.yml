services:
  mariadb:
    image: mariadb:10.1
    container_name: proxide-mariadb
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: proxide
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - mariadb_data:/var/lib/mysql

  rustfs:
    image: rustfs/rustfs:latest
    container_name: proxide-rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: proxide
      RUSTFS_SECRET_KEY: proxide123
    volumes:
      - rustfs_data:/data
    command: ["/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 3s
      timeout: 5s
      retries: 30

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: proxide-meilisearch
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: proxide
      MEILI_ENV: development
    volumes:
      - meili_data:/meili_data

volumes:
  mariadb_data:
  rustfs_data:
  meili_data:
