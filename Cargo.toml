[package]
name = "proxide"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.6", features = ["macros"] }
mimalloc = "0.1.48"
object_store = "0.12.4"
reqwest = "0.12.24"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "mysql"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = [
    "signal",
    "rt-multi-thread",
    "macros",
    "time",
] }
tower-http = "0.6.6"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
utoipa = "5.4.0"
utoipa-axum = "0.2.0"
utoipa-gen = "5.4.0"
utoipa-scalar = "0.3.0"
clap = { version = "4.5.51", features = ["derive"] }
