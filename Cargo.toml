[package]
name = "proxide"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.6", features = ["macros"] }
mimalloc = "0.1.48"
object_store = { version = "0.12.4", features = ["aws", "fs"] }
reqwest = { version = "0.12.24", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_json_canonicalizer = "0.3.2"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "mysql", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = [
  "fs",
  "signal",
  "rt-multi-thread",
  "macros",
  "time",
  "io-util",
  "sync",
] }
tower-http = { version = "0.6.6", features = [
  "timeout",
  "trace",
  "cors",
  "compression-full",
  "set-header",
] }

tracing = "0.1.41"
tracing-subscriber = "0.3.20"
utoipa = { version = "5.4.0", features = ["chrono", "axum_extras"] }
utoipa-axum = "0.2.0"
utoipa-gen = "5.4.0"
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
clap = { version = "4.5.51", features = ["derive"] }
fastrace = { version = "0.7.14", features = ["enable"] }
fastrace-tracing = "0.1.1"
toml = "0.9.8"
anyhow = "1.0.100"
log = "0.4.28"
logforth = { version = "0.29.1", features = ["starter-log"] }
async-trait = "0.1"
parking_lot = "0.12"
futures = "0.3"
percent-encoding = "2.3.2"
wiremock = "0.6.5"
semver = { version = "1.0", features = ["serde"] }
url = "2.5"
bytes = "1.10"
tokio-stream = "0.1"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.3"
quick-xml = "0.37"
regex = "1"
dashmap = "6"
meilisearch-sdk = "0.28"
flate2 = "1.1"
tar = "0.4"
zstd = "0.13"
mime_guess = "2"
async-compression = { version = "0.4", features = ["tokio", "zstd"] }
tokio-util = { version = "0.7", features = ["io"] }

[lints.rust]
async_fn_in_trait = "allow"
